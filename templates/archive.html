{% extends "base.html" %}
{% block title %}Archive &mdash; Quote of the Day{% endblock %}
{% block content %}
<section>
  <h1>Archive</h1>
  <ul class="archive-list archive-list--full">
    {% for d in days %}
    <li>
      <a href="{{ d.page }}">{{ d.date_label }}</a>
      <span class="archive-snippet">&ldquo;{{ d.text[:100] }}{{ '…' if d.text|length > 100 else '' }}&rdquo;</span>
      <span class="muted">{{ d.word_count }} words</span>
    </li>
    {% endfor %}
  </ul>
</section>
{% endblock %}
